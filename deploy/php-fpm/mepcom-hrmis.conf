; managed-by: mepcom-hrmis deploy kit
; MEPCOM HRMIS PHP-FPM pool: its own user, socket and limits. Settings here
; apply to this pool only; the shared /etc/php.ini is never edited.
[mepcom-hrmis]
user = mepcom
group = mepcom
listen = /run/php-fpm/mepcom-hrmis.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

; small and on-demand, so this app can never take PHP workers from the others
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 60s
pm.max_requests = 500

request_terminate_timeout = 120
catch_workers_output = yes

php_admin_value[error_log] = /var/log/php-fpm/mepcom-hrmis-error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60
php_admin_value[date.timezone] = Asia/Manila
; documents: 10 MB each, several per form (the app validates each file)
php_admin_value[upload_max_filesize] = 12M
php_admin_value[post_max_size] = 120M
php_admin_value[max_file_uploads] = 20
php_admin_value[max_input_vars] = 3000
php_admin_flag[expose_php] = off
